<style>
#funnelworks-hero-root, #funnelworks-hero-root *, #funnelworks-hero-root *::before, #funnelworks-hero-root *::after {
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#funnelworks-hero-root {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #0a0a0a;
  color: #fafafa;
  font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
}

#funnelworks-hero-root .funnelworks-particle-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: 0.6;
}

#funnelworks-hero-root .funnelworks-accent-lines {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

#funnelworks-hero-root .funnelworks-hline,
#funnelworks-hero-root .funnelworks-vline {
  position: absolute;
  background: #27272a;
  opacity: 0.75;
  will-change: transform, opacity;
}

#funnelworks-hero-root .funnelworks-hline {
  height: 1px;
  left: 0;
  right: 0;
  transform: scaleX(0);
  transform-origin: 50% 50%;
  animation: funnelworks-drawX 800ms cubic-bezier(.22,.61,.36,1) forwards;
}
#funnelworks-hero-root .funnelworks-hline:nth-child(1) { top: 20%; animation-delay: 150ms; }
#funnelworks-hero-root .funnelworks-hline:nth-child(2) { top: 50%; animation-delay: 280ms; }
#funnelworks-hero-root .funnelworks-hline:nth-child(3) { top: 80%; animation-delay: 410ms; }

#funnelworks-hero-root .funnelworks-vline {
  width: 1px;
  top: 0;
  bottom: 0;
  transform: scaleY(0);
  transform-origin: 50% 0%;
  animation: funnelworks-drawY 900ms cubic-bezier(.22,.61,.36,1) forwards;
}
#funnelworks-hero-root .funnelworks-vline:nth-child(4) { left: 20%; animation-delay: 520ms; }
#funnelworks-hero-root .funnelworks-vline:nth-child(5) { left: 50%; animation-delay: 640ms; }
#funnelworks-hero-root .funnelworks-vline:nth-child(6) { left: 80%; animation-delay: 760ms; }

#funnelworks-hero-root .funnelworks-line-gold {
  background: #ffc000;
  opacity: 0.4;
}

#funnelworks-hero-root .funnelworks-hline::after,
#funnelworks-hero-root .funnelworks-vline::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(250,250,250,.25), transparent);
  opacity: 0;
  animation: funnelworks-shimmer 900ms ease-out forwards;
}
#funnelworks-hero-root .funnelworks-hline:nth-child(1)::after { animation-delay: 150ms; }
#funnelworks-hero-root .funnelworks-hline:nth-child(2)::after { animation-delay: 280ms; }
#funnelworks-hero-root .funnelworks-hline:nth-child(3)::after { animation-delay: 410ms; }
#funnelworks-hero-root .funnelworks-vline:nth-child(4)::after { animation-delay: 520ms; }
#funnelworks-hero-root .funnelworks-vline:nth-child(5)::after { animation-delay: 640ms; }
#funnelworks-hero-root .funnelworks-vline:nth-child(6)::after { animation-delay: 760ms; }

@keyframes funnelworks-drawX {
  0% { transform: scaleX(0); opacity: 0; }
  60% { opacity: .9; }
  100% { transform: scaleX(1); opacity: .75; }
}
@keyframes funnelworks-drawY {
  0% { transform: scaleY(0); opacity: 0; }
  60% { opacity: .9; }
  100% { transform: scaleY(1); opacity: .75; }
}
@keyframes funnelworks-shimmer {
  0% { opacity: 0; }
  30% { opacity: .25; }
  100% { opacity: 0; }
}

#funnelworks-hero-root .funnelworks-content-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

#funnelworks-hero-root .funnelworks-content {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 24px;
  text-align: left;
}

#funnelworks-hero-root .funnelworks-content p {
  margin: 0;
}
</style>

<div id="funnelworks-hero-root">
  <canvas class="funnelworks-particle-canvas" id="funnelworksParticleCanvas"></canvas>

  <div class="funnelworks-accent-lines">
    <div class="funnelworks-hline"></div>
    <div class="funnelworks-hline funnelworks-line-gold"></div>
    <div class="funnelworks-hline"></div>
    <div class="funnelworks-vline"></div>
    <div class="funnelworks-vline funnelworks-line-gold"></div>
    <div class="funnelworks-vline"></div>
  </div>

  <div class="funnelworks-content-wrap">
    <div class="funnelworks-content">
      <p style="line-height: 1.5; text-align: left;"><span style="font-size: 32px;"><strong>광고비에만</strong></span>
        <br><span style="font-size: 32px;"><strong>수천 쓴 대표님들이</strong></span></p>

      <p style="line-height: 1.5; text-align: left;">
        <br>
      </p>

      <p style="line-height: 1.5; text-align: left;">
        <br>
      </p>

      <p style="line-height: 1.5; text-align: left;"><span style="font-size: 40px;"><strong>왜 항상 마지막에</strong></span>
        <br><span style="font-size: 40px;"><strong><span style="color: rgb(255, 192, 0);">퍼널웍스를 찾아올까요?</span></strong></span></p>
    </div>
  </div>
</div>

<script>
(function () {
  var root = document.getElementById('funnelworks-hero-root');
  var canvas = root.querySelector('#funnelworksParticleCanvas');
  var ctx = canvas.getContext('2d');
  if (!ctx) return;

  function setSize() {
    canvas.width = root.clientWidth;
    canvas.height = root.clientHeight;
  }
  setSize();

  var particles = [];
  var raf = 0;

  function count() {
    return Math.floor((canvas.width * canvas.height) / 7000);
  }

  function make() {
    var fadeDelay = Math.random() * 600 + 100;
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: Math.random() / 5 + 0.1,
      opacity: 0.7,
      fadeDelay: fadeDelay,
      fadeStart: Date.now() + fadeDelay,
      fadingOut: false
    };
  }

  function reset(p) {
    p.x = Math.random() * canvas.width;
    p.y = Math.random() * canvas.height;
    p.speed = Math.random() / 5 + 0.1;
    p.opacity = 0.7;
    p.fadeDelay = Math.random() * 600 + 100;
    p.fadeStart = Date.now() + p.fadeDelay;
    p.fadingOut = false;
  }

  function init() {
    particles = [];
    var n = count();
    for (var i = 0; i < n; i++) particles.push(make());
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(function (p) {
      p.y -= p.speed;
      if (p.y < 0) reset(p);
      if (!p.fadingOut && Date.now() > p.fadeStart) p.fadingOut = true;
      if (p.fadingOut) {
        p.opacity -= 0.008;
        if (p.opacity <= 0) reset(p);
      }
      ctx.fillStyle = 'rgba(250, 250, 250, ' + p.opacity + ')';
      ctx.fillRect(p.x, p.y, 0.6, Math.random() * 2 + 1);
    });
    raf = requestAnimationFrame(draw);
  }

  function onResize() {
    setSize();
    init();
  }

  window.addEventListener('resize', onResize);
  init();
  raf = requestAnimationFrame(draw);
})();
</script>
